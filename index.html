<title>상중하초 처방 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 왼쪽 증상 판(상초·중초·하초·표증·한열) / 오른쪽 처방 결과와 펼쳐지는 처방 카드 — 방극 앱과 같은 청자·자주 톤 */
:root{
 --bg:#F2F4F1;--panel:#FAFBF9;--ink:#1E2422;--muted:#5E6862;--line:#CDD5CF;
 --jade:#2F6B57;--jade-soft:#DCEAE3;--plum:#8B3A4A;--plum-soft:#F1DFE3;--gold:#7A5B1E;--gold-soft:#F2EAD6;--mark:#E3EFE8;
 --serif:"Noto Serif KR","Songti SC","Batang",serif;--sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141917;--panel:#1A201D;--ink:#E4EAE6;--muted:#9AA59F;--line:#2E3833;--jade:#72BB9E;--jade-soft:#1F3A30;--plum:#DA8698;--plum-soft:#3B232A;--gold:#D9B66C;--gold-soft:#352C18;--mark:#23413A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141917;--panel:#1A201D;--ink:#E4EAE6;--muted:#9AA59F;--line:#2E3833;--jade:#72BB9E;--jade-soft:#1F3A30;--plum:#DA8698;--plum-soft:#3B232A;--gold:#D9B66C;--gold-soft:#352C18;--mark:#23413A;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.head{padding-inline:20px;padding-block:20px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-end}
.head h1{font-family:var(--serif);font-size:clamp(1.5rem,3.5vw,2.1rem);margin:0;letter-spacing:.02em}
.head p{margin:0;color:var(--muted);font-size:.9rem;max-width:60ch}
.wrap{display:grid;grid-template-columns:minmax(330px,430px) 1fr;min-height:calc(100% - 90px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding-inline:18px;padding-block:14px 60px;overflow-y:auto;max-height:calc(100vh - 90px);position:sticky;top:0}
.main{padding-inline:24px;padding-block:18px 80px;min-width:0}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input{flex:1;min-width:0;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.btn{border:1px solid var(--line);background:var(--bg);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.cat{margin:0 0 16px}
.cat h2{font-family:var(--serif);font-size:1.05rem;margin:0 0 7px;padding-bottom:5px;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:baseline}
.cat h2 span{font-family:var(--sans);font-size:.75rem;color:var(--muted);font-weight:400}
.cat.pend h2{color:var(--plum)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 9px;cursor:pointer;line-height:1.25;text-align:left}
.chip b{font-family:var(--serif);font-weight:600;font-size:.98rem}
.chip small{display:block;font-size:.68rem;color:var(--muted)}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.chip.on small{color:var(--bg);opacity:.85}
.chip.pend{border-style:dashed}
.chip[hidden]{display:none}
.sel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px;margin-bottom:12px}
.sel .lab{font-size:.8rem;color:var(--muted)}
.pill{font-family:var(--serif);padding:2px 10px;border-radius:999px;border:1px solid var(--jade);color:var(--jade);background:var(--jade-soft);cursor:pointer}
.empty{max-width:560px;padding-block:36px}
.empty .big{font-family:var(--serif);font-size:1.5rem;line-height:1.5;margin:0 0 10px}
.empty p{color:var(--muted);margin:0 0 12px}
.key{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted);margin:0 0 10px;align-items:center}
.sec{margin:20px 0 8px;display:flex;align-items:baseline;gap:10px}
.sec h3{margin:0;font-size:1rem}
.sec span{font-size:.8rem;color:var(--muted)}
.list{border-top:1px solid var(--line)}
.res{border-bottom:1px solid var(--line)}
.res>button{display:grid;grid-template-columns:2rem 1fr auto;gap:4px 12px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:11px 4px;cursor:pointer}
.res>button:hover{background:var(--panel)}
.rk{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nmz{min-width:0}
.nmz b{font-family:var(--serif);font-size:1.15rem;font-weight:600}
.nmz span{color:var(--muted);font-size:.82rem;margin-left:6px}
.ev{display:flex;flex-wrap:wrap;gap:4px;grid-column:2/4}
.e{font-size:.72rem;border-radius:4px;padding:0 6px;white-space:nowrap;border:1px solid var(--line)}
.e .x{display:inline-flex;gap:3px;margin-left:4px}
.x i{font-style:normal;border-radius:3px;padding:0 3px;font-size:.66rem}
.i-f{background:var(--jade-soft);color:var(--jade)}.i-s{background:var(--plum-soft);color:var(--plum)}.i-c{background:var(--gold-soft);color:var(--gold)}
.e.miss{opacity:.45;text-decoration:line-through}
.cnt{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{padding:4px 4px 18px 2.6rem;display:grid;gap:14px}
.card[hidden]{display:none}
.blk .lb{display:inline-block;font-size:.7rem;letter-spacing:.04em;color:var(--bg);background:var(--jade);border-radius:4px;padding:0 6px;margin-bottom:6px}
.blk.jw .lb{background:var(--plum)}.blk.yj .lb{background:var(--ink)}
.raw{font-family:var(--serif);font-size:1.12rem;line-height:1.75;margin:0}
.raw mark{background:var(--mark);color:inherit;border-bottom:2px solid var(--jade)}
.jwt p{font-family:var(--serif);margin:3px 0 0;line-height:1.75}
.comp{font-size:.95rem}
.dose{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:.92rem;margin-top:4px}
.dose b{font-family:var(--serif);font-weight:600}
.dose small{color:var(--muted)}
.yjr{display:grid;grid-template-columns:5.5rem 1fr;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:.92rem}
.yjr b{font-family:var(--serif);font-size:1rem;display:block}
.yjr small{color:var(--muted);font-size:.72rem}
.yjt{font-family:var(--serif);line-height:1.65;min-width:0}
.na{color:var(--muted);font-size:.85rem}
.where{display:flex;flex-wrap:wrap;gap:4px}
.where .e{cursor:pointer;background:var(--panel)}
.where .e.on{border-color:var(--jade);color:var(--jade)}
.blk.cs .lb{background:var(--gold)}
.cst{overflow-x:auto}
.cst table{border-collapse:collapse;width:100%;font-size:.86rem}
.cst th,.cst td{text-align:left;padding:4px 8px;border-top:1px solid var(--line);vertical-align:top}
.cst th{font-weight:500;color:var(--muted);font-size:.74rem}
.cst tr.hit td{background:var(--gold-soft)}
.cst small{color:var(--muted)}
.bk{font-size:.7rem;border-radius:4px;padding:0 5px;white-space:nowrap}
.bk.b0{background:var(--gold-soft);color:var(--gold)}.bk.b1{background:var(--plum-soft);color:var(--plum)}
.foot{font-size:.8rem;color:var(--muted);max-width:70ch;margin-top:36px;line-height:1.7}
.mbar{display:none}
@media (max-width:820px){
 .wrap{grid-template-columns:1fr}
 .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding-inline:16px}
 .main{padding-inline:16px}
 .card{padding-left:4px}
 .mbar{display:block;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border:0;font-weight:600;width:100%;cursor:pointer}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.chip.part{border-color:var(--jade);box-shadow:inset 0 -3px 0 var(--jade)}
.chip.open{border-color:var(--ink)}
.chip .arr{font-size:.65rem;color:var(--muted);margin-left:4px}
.subp{flex-basis:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 4px}
.subp .cap{flex-basis:100%;font-size:.72rem;color:var(--muted)}
.sc{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 8px;cursor:pointer;font-family:var(--serif);font-size:.92rem;display:inline-flex;gap:4px;align-items:center}
.sc.all{font-family:var(--sans);font-size:.8rem;border-style:dashed}
.sc.on{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.sc .x i{font-family:var(--sans)}
.sc.on .x i{background:transparent;color:var(--bg);border:1px solid currentColor}
.sc small{font-family:var(--sans);font-size:.68rem;color:var(--muted)}
.sc.on small{color:var(--bg)}
.herbsec{margin-top:10px;padding-top:12px;border-top:2px solid var(--line)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:1px 6px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.hgrid+.hgrid{margin-top:6px}
.hk{display:flex;align-items:center;gap:5px;font-size:.88rem;cursor:pointer;padding:2px 0;white-space:nowrap}
.hk input{width:15px;height:15px;margin:0;accent-color:var(--jade);flex:none}
.hk:has(input:checked) span{color:var(--jade);font-weight:600}
.hk.dead{opacity:.3;cursor:default}
.hk small{font-size:.65rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hbtns{display:flex;gap:14px;margin-top:6px;font-size:.8rem}
.lnk{border:0;background:none;padding:0;color:var(--jade);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font:inherit}
.pill.herb{font-family:var(--sans);font-size:.85rem;border-style:dashed}
.blk.ca .lb{background:var(--jade)}.blk.cb .lb{background:var(--plum)}
.cad{border-top:1px solid var(--line);padding:6px 0}
.cad summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.cad summary b{font-family:var(--serif);font-weight:600}
.cad summary span{font-size:.8rem;color:var(--muted)}
.cad summary small{flex-basis:100%;font-size:.85rem;color:var(--ink)}
.cad.hit>summary{background:var(--jade-soft)}
.cad dl{margin:8px 0 4px;display:grid;grid-template-columns:5.5rem 1fr;gap:4px 12px;font-size:.88rem}
.cad dt{color:var(--muted);font-size:.78rem}
.cad dd{margin:0;min-width:0}.cad dd p{margin:0 0 3px}
.cbt{font-size:.9rem;margin:6px 0;line-height:1.65}
mark{background:var(--mark);color:inherit}
.fksec{margin-top:10px;padding-top:12px;border-top:2px solid var(--line)}
.fkg h3{font-family:var(--serif);font-size:.92rem;margin:10px 0 5px;color:var(--muted);font-weight:600}
.fkg h3 span{font-family:var(--sans);font-size:.7rem;font-weight:400}
.fkg .chips+.chips{margin-top:5px}
.fc{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 8px;cursor:pointer;line-height:1.2;text-align:left}
.fc b{font-family:var(--serif);font-weight:600;font-size:.92rem;display:block}
.fc small{font-size:.64rem;color:var(--muted)}
.fc.sub{border-style:dashed}
.fc.on{background:var(--jade);border-color:var(--jade);color:var(--bg)}.fc.on small{color:var(--bg)}
.fc.off{background:var(--plum-soft);border-color:var(--plum);color:var(--plum)}.fc.off b{text-decoration:line-through}
.pill.fk{border-style:solid;font-size:.9rem}
.pill.no{border-color:var(--plum);color:var(--plum);background:var(--plum-soft);text-decoration:line-through}
.used{display:grid;gap:6px}
.used .ur{display:grid;grid-template-columns:3.2rem 1fr;gap:8px;align-items:baseline}
.used .us{font-size:.75rem;color:var(--muted)}
.used .ul{display:flex;flex-wrap:wrap;gap:4px 10px}
.used .ug{font-size:.9rem}
.used .ug b{font-family:var(--serif)}
.used .ug .e{cursor:pointer;margin-left:2px}
.used .ug .e.on{border-color:var(--jade);color:var(--jade)}
</style>
</head><body>
<header class="head">
 <h1>상중하초 처방 찾기</h1>
 <p>증상을 누르면 그 아래 세부 증상이 펼쳐지고, 세부 증상을 누르면 해당 처방이 나옵니다. 맨 아래 약재를 체크하면 그 조합이 든 처방으로 좁혀집니다.</p>
<button id="installBtn" type="button" hidden>앱으로 설치</button>
</header>
<div class="wrap">
 <aside class="side">

  <div id="pal"></div>
  <div id="fkbox"></div>
  <div id="herbbox"></div>
 </aside>
 <main class="main" id="out"></main>
</div>
<button class="mbar" id="mbar" type="button">처방 보기</button>

D.rows.forEach((r,ri)=>{r.subs.forEach((s,si)=>s.cnt=SUBN[ri+'.'+si]||0); r.live=r.subs.map((s,si)=>si).filter(si=>r.subs[si].cnt);});

const keyName=k=>{const [r,s]=k.split('.');const R=D.rows[+r];return s===undefined?R.name+' 전체':R.subs[+s].n;};

          `<button type="button" class="sc all" data-k="${i}">${esc(r.name)} 전체</button>`+
          r.live.map(si=>{const s=r.subs[si];return `<button type="button" class="sc" data-k="${i}.${si}">${esc(s.n)}<span class="x">${s.src.map(x=>`<i class="${SRC[x][0]}">${SRC[x][1]}</i>`).join('')}</span><small>${s.cnt}</small></button>`;}).join('');

    const on=sel.has(String(i))||(r.live.length===1&&sel.has(i+'.'+r.live[0])); const part=!on&&[...sel].some(k=>k.startsWith(i+'.'));

function filterChips(q){document.querySelectorAll('.chip[data-r]').forEach(b=>{const r=D.rows[+b.dataset.r]; b.hidden=!!q&&!([r.name,r.kr||'',...r.subs.map(s=>s.n)].join(' ').includes(q));});}
// 약재
const HF={};D.cat.forEach(e=>e.h.forEach(h=>HF[h]=(HF[h]||0)+1));

// 方極 주치

   FK.LAYOUT.map(([lab,hz,rows])=>`<div class="fkg"><h3>${lab} <span>${hz}</span></h3>${rows.map(r=>`<div class="chips">${r.filter(t=>TK[t]).map(t=>`<button type="button" class="fc${TK[t].pa?' sub':''}" data-t="${t}"><b>${t}</b><small>${esc(TK[t].kr)}</small></button>`).join('')}</div>`).join('')}</div>`).join('')+`</section>`;

const fpos=()=>[...fst].filter(([,v])=>v===1).map(([k])=>k), fneg=()=>[...fst].filter(([,v])=>v===2).map(([k])=>k);
function fOK(e,P,N){
  if(!P.length&&!N.length) return true;
  const fz=P.includes('惡寒'),fzn=N.includes('惡寒');
  if(fz&&!e.h.includes('부자')) return false; if(fzn&&e.h.includes('부자')) return false;
  const P2=P.filter(t=>t!=='惡寒'),N2=N.filter(t=>t!=='惡寒');
  if(!P2.length&&!N2.length) return true;
  const r=e.fid&&FK.R[e.fid]; if(!r) return false;
  const [req,exp,negs]=r;
  if(N2.some(n=>req.includes(n))) return false;
  if(P2.some(t=>[t,...ANC(t)].some(a=>negs.includes(a)))) return false;
  return P2.every(t=>exp.includes(t));
}
function fScore(e,P){const r=e.fid&&FK.R[e.fid]; if(!r||!P.length) return 0; const cov=new Set(); P.forEach(t=>{cov.add(t);ANC(t).forEach(a=>cov.add(a));}); return r[0].filter(t=>!cov.has(t)).length;}
// 결과
function wt(v){return v?(v.f?3:0)+(v.s?2:0)+Math.min(v.c,5)+(v.fz?3:0):0;}
function score(e,keys){let s=0;keys.forEach(k=>{if(k.includes('.')) s+=wt(e.m[k]); else D.rows[+k].live.forEach(si=>s+=wt(e.m[k+'.'+si]));});return s;}
const title=e=>{const f=e.fid?D.F[e.fid]:null;return {hz:f?f.name:'',kr:f?f.kr:e.names[0]};};
function evTag(e,k){
  const ok=has(e,k); let x='';
  if(ok){const vs=k.includes('.')?[e.m[k]]:D.rows[+k].live.map(si=>e.m[k+'.'+si]).filter(Boolean);
    const agg={f:0,s:0,c:0,fz:0};vs.forEach(v=>{agg.f+=v.f;agg.s+=v.s;agg.c+=v.c;agg.fz+=v.fz||0;});
    x=`${agg.fz?'<i class="i-f">附子</i>':''}${agg.f?'<i class="i-f">方極</i>':''}${agg.s?'<i class="i-s">색인</i>':''}${agg.c?`<i class="i-c">의안 ${agg.c}</i>`:''}`;}
  return `<span class="e${ok?'':' miss'}">${esc(keyName(k))}${ok?`<span class="x">${x}</span>`:''}</span>`;
}
function hlRaw(f,keys){
  let s=esc(f.raw); const forms=new Set();
  keys.forEach(k=>{if(k.startsWith('fk:')){(TK[k.slice(3)]?[k.slice(3)]:[]).forEach(x=>forms.add(x));return;} const [r,si]=k.split('.');const R=D.rows[+r];(si===undefined?R.subs:[R.subs[+si]]).forEach(x=>{if(x.src.includes('f')) forms.add(x.n);});});
  const list=[...forms].filter(t=>s.includes(t)).sort((a,b)=>b.length-a.length);
  return list.length?s.replace(new RegExp(list.join('|'),'g'),m=>`<mark>${m}</mark>`):s;
}
function card(e,keys){ keys=keys.concat(fpos().map(t=>'fk:'+t));
  const f=e.fid?D.F[e.fid]:null, it=e.hb!=null?D.items[e.hb]:null; let h='';
  // 쓰인 곳
  const by={}; Object.keys(e.m).forEach(k=>{const [r,si]=k.split('.').map(Number);const R=D.rows[r];(by[R.sec]=by[R.sec]||{});(by[R.sec][r]=by[R.sec][r]||[]).push(si);});
  h+=`<div class="blk"><span class="lb">이 처방이 쓰인 곳</span><div class="used">${D.secs.filter(s=>by[s]).map(s=>`<div class="ur"><span class="us">${s}</span><div class="ul">${Object.keys(by[s]).map(Number).sort((a,b)=>a-b).map(r=>`<span class="ug"><b>${esc(D.rows[r].name)}</b>${D.rows[r].live.length>1?by[s][r].map(si=>{const k=r+'.'+si,v=e.m[k];return `<span class="e${sel.has(k)?' on':''}" data-add="${k}">${esc(D.rows[r].subs[si].n)}${v.c?` <i class="i-c" style="font-style:normal;font-size:.66rem;padding:0 3px;border-radius:3px">${v.c}</i>`:''}</span>`;}).join(''):''}</span>`).join('')}</div></div>`).join('')}</div></div>`;
  h+=`<div class="blk"><span class="lb">方極</span>${f&&f.raw?`<p class="raw">${hlRaw(f,keys)}</p>${f.note?`<p class="na">${esc(f.note)}</p>`:''}`:'<p class="na">『方極』에 주치가 없는 처방입니다.</p>'}</div>`;
  h+=`<div class="blk jw"><span class="lb">조문</span>${it&&it.jw.length?`<div class="jwt">${it.jw.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`:'<p class="na">조문 자료가 없습니다.</p>'}</div>`;
  const dk=(f&&f.dose&&D.DOSE[f.dose])||null;
  h+=`<div class="blk"><span class="lb">구성</span>${it?`<div class="comp">${esc(it.comp)}</div>`:''}${dk?`<div class="dose">${(()=>{const o=[];dk.h.forEach(([n,d])=>{if(d===0){if(o.length)o[o.length-1].a.push(n);return;}o.push({n,d,a:[]});});return o.map(x=>`<span><b>${esc(x.n)}</b> ${x.d==null?'적량':esc(String(x.d).replace(/_/g,'~'))}${x.a.length?`<small> 또는 ${esc(x.a.join('·'))}</small>`:''}</span>`).join('');})()}</div>`:''}</div>`;
  h+=`<div class="blk yj"><span class="lb">『藥徵』 주치</span>${e.h.length?e.h.map(x=>{const c=D.H2C[x],t=c&&D.YJ[c];return `<div class="yjr"${hsel.has(x)?' style="background:var(--jade-soft)"':''}><span><b>${esc(c||x)}</b><small>${esc(hl(x))}</small></span><span class="yjt">${t?esc(t):'<span class="na">『藥徵』 미수록</span>'}</span></div>`;}).join(''):'<p class="na">약재 자료가 없습니다.</p>'}</div>`;
  keys=keys.filter(k=>!k.startsWith('fk:'));
  const inSel=c=>keys.some(k=>c[3]===k||(!k.includes('.')&&c[3].startsWith(k+'.')));
  const cs=e.cs.slice().sort((a,b)=>inSel(b)-inSel(a)); const nHit=cs.filter(inSel).length;
  h+=`<div class="blk cs"><span class="lb">금궤·상한 의안 ${cs.length}건</span>${cs.length?`${nHit?`<p class="na">선택한 증상에 해당하는 의안 ${nHit}건이 위에 있습니다.</p>`:''}<div class="cst"><table><thead><tr><th>출전</th><th>분류</th><th>원 병명</th><th>양방 진단</th></tr></thead><tbody>${cs.map(c=>{const [r,si]=c[3]?c[3].split('.').map(Number):[-1];return `<tr class="${inSel(c)?'hit':''}"><td><span class="bk b${c[0]}">${c[0]?'상한':'금궤'}</span></td><td>${r>=0?esc(D.rows[r].name):'<span class="na">표 밖</span>'}</td><td>${esc(c[1])}${c[4]!==title(e).kr?`<small> · ${esc(c[4])}</small>`:''}</td><td>${esc(c[2])}</td></tr>`;}).join('')}</tbody></table></div>`:'<p class="na">연결된 의안이 없습니다.</p>'}</div>`;
  h+=clinic(e,keys);
  return h;
}
const LABS=['환자','주증','정신','수면','외감','허로','두면','흉복','요협','수족','피부','부인','키워드','체형','추위 寒','더위 熱','땀','음수','식욕','소화','대변','소변','호흡','복진','설진','맥진','평가'];
function clinic(e,keys){
  const n=CC[e.k]||[0,0]; if(!n[0]&&!n[1]) return '';
  if(!CASES) return `<div class="blk ca"><span class="lb">임상 의안 ${n[0]}건 · 類聚方新解 치험 ${n[1]}건</span><p class="na">${CASEERR?'의안 자료(cases.json)를 불러오지 못했습니다. 인터넷에 연결된 상태로 한 번 다시 열어 주세요.':'의안 자료를 불러오는 중입니다.'}</p></div>`;
  const c=CASES[e.k]||{a:[],b:[]}; let h='';
  const words=[...new Set(keys.flatMap(k=>{const [r,si]=k.split('.');const R=D.rows[+r];return (si===undefined?R.subs:[R.subs[+si]]).map(s=>s.n).concat([R.name]);}).flatMap(w=>w.split('·')).filter(w=>w.length>1))];
  const mk=t=>{let s=esc(t); words.forEach(w=>{if(s.includes(w)) s=s.split(w).join('<mark>'+w+'</mark>');}); return s;};

    const arr=c.a.slice().sort((x,y)=>hitA(y)-hitA(x));

  }
  if(c.b.length){
    const g={}; c.b.forEach(([hd,t])=>{(g[hd]=g[hd]||[]).push(t);});
    const hm=hd=>words.some(w=>(hd+g[hd].join()).includes(w));
    const hds=Object.keys(g).sort((x,y)=>hm(y)-hm(x));
    h+=`<div class="blk cb"><span class="lb">類聚方新解 치험 ${c.b.length}건</span>${hds.map(hd=>`<details class="cad"${hm(hd)?' open':''}><summary><b>${mk(hd||'기타')}</b> <span>${g[hd].length}건</span></summary>${g[hd].map(t=>`<p class="cbt">${mk(t)}</p>`).join('')}</details>`).join('')}</div>`;
  }
  return h;
}
function render(){

  const list=(arr,start)=>`<div class="list">${arr.map((x,k)=>{const t=title(x.e),open=openK===x.e.k;
    return `<div class="res"><button type="button" data-o="${esc(x.e.k)}" aria-expanded="${open}"><span class="rk">${start+k}</span><span class="nmz"><b>${esc(t.hz||t.kr)}</b>${t.hz?`<span>${esc(t.kr)}</span>`:''}</span><span class="cnt">${keys.length?x.n+'/'+keys.length:P.length?'추가 주치 '+x.fs:x.e.h.length+'미'}</span><span class="ev">${keys.map(k=>evTag(x.e,k)).join('')}</span></button><div class="card"${open?'':' hidden'}>${open?card(x.e,keys):''}</div></div>`;}).join('')}</div>`;
  const what='조건';
  if(full.length) h+=`<div class="sec"><h3>${keys.length>1||herbs.length||P.length||N.length?'모두 해당':'해당 처방'}</h3><span>${full.length}개 · ${keys.length?'근거가 많은 순':P.length?'선택하지 않은 方極 주치가 적은 순':'약재 수가 적은 순'}</span></div>`+list(full.slice(0,80),1)+(full.length>80?`<p class="na">외 ${full.length-80}개. 더 좁혀 보세요.</p>`:'');
  else h+=`<p class="na" style="padding:12px 0">선택한 ${what}을 모두 갖춘 처방이 없습니다.</p>`;
  if(part.length&&keys.length>1) h+=`<div class="sec"><h3>일부 해당</h3><span>${part.length}개</span></div>`+list(part.slice(0,full.length?10:30),full.length+1);
  R.innerHTML=h+foot();
  R.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{sel.delete(b.dataset.rm);render();});
  R.querySelectorAll('[data-hx]').forEach(b=>b.onclick=()=>{hsel.delete(b.dataset.hx);render();});
  R.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{fst.delete(b.dataset.fx);render();});
  R.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{openK=openK===b.dataset.o?null:b.dataset.o;render();});
  R.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const k=b.dataset.add;sel.has(k)?sel.delete(k):sel.add(k);render();});
  $('#mbar').textContent=`처방 ${full.length||part.length}개 보기`;
}
function foot(){return `<p class="foot">위 증상 판은 원장님이 정한 상초·중초·하초·표증·한열 분류이고, 가운데 「方極 주치로 찾기」는 기존 방극 앱의 『方極』 원문 주치 판입니다. 증상 판의 세부 증상은 『方極』 주치(方極), 90개 증상 색인(색인), 금궤·상한 의안 병명(의안)에서 왔습니다. 惡寒은 附子가 든 처방만 보여 줍니다. 의안은 「금궤·상한 의안 병명색인」, 임상 의안 문서, 『類聚方新解』의 치험례를 처방명으로 연결했습니다. 의안 본문은 따로 저장된 의안 자료 파일에서 불러오므로, 의안을 새로 넣을 때는 그 파일만 바꾸면 됩니다.</p>`;}
$('#q').oninput=e=>filterChips(e.target.value.trim());
$('#reset').onclick=()=>{sel.clear();hsel.clear();fst.clear();openK=null;openRow=null;pal();herbBox();render();};
$('#mbar').onclick=()=>$('#out').scrollIntoView({behavior:'smooth'});
pal(); fkBox(); herbBox(); render();
</script>
